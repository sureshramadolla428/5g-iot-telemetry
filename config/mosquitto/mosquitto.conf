# MQTT listener (internal 1883, published on host as MQTT_HOST_PORT).
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# MQTT v5 server keepalive cap (global). Do not set keepalive or
# keepalive_interval here — those are bridge-only and crash 2.0.x with
# "Invalid bridge configuration". Client keepalive is set by publishers.
max_keepalive 300

# Sys topics for operator visibility inside this isolated broker only.
sys_interval 10
